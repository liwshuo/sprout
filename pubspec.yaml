name: sprout
description: "孩子成长记录 App —— 记录日常、阅读打卡、课表管理与周报生成。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^13.0.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  workmanager: ^0.5.2
  intl: ^0.19.0
  dio: ^5.4.3+1
  path: ^1.9.0
  # 通知 / 分享 / 权限 / 语音 / 扫码 / 日历（技术方案 §2.1）
  flutter_local_notifications: ^17.2.2
  share_plus: ^9.0.0
  permission_handler: ^11.3.1
  speech_to_text: ^6.6.2
  mobile_scanner: ^5.2.3
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
